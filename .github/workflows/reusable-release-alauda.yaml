name: Release Alauda

on:
  workflow_call:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: alauda-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Generate Version
        id: generate_version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # remove "alauda-" prefix
          GENERATED_VERSION=$(echo "$REF_NAME" | sed 's/alauda-//')
          echo "GENERATED_VERSION=$GENERATED_VERSION" >> $GITHUB_OUTPUT

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          version: v2.1.0
          args: release -f=goreleaser-alauda.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATED_VERSION: ${{ steps.generate_version.outputs.GENERATED_VERSION }}
